document.addEventListener('change',e=>{let t=e.target;if(t.dataset.gymInput){let [day,letter,id,field]=t.dataset.gymInput.split('|');if(plannedGym(day)!==letter)return;const value=t.value.trim(),num=Number(value);if(value&&(!Number.isFinite(num)||(field==='weight'&&(num<0||num>500))||(field==='reps'&&(!Number.isInteger(num)||num<1||num>50)))){toast('Revisa el número ingresado');return;}state.gymLogs??={};const key=day+'|'+letter;state.gymLogs[key]??={};state.gymLogs[key][id]??={};state.gymLogs[key][id][field]=value;save();toast('Registro guardado');return;}
 if(t.dataset.shop){state.shopping[t.dataset.shop]=t.checked;save();render();return;}if(t.dataset.input==='goto'){if(within(t.value))selectedDate(t.value);return;}if(t.dataset.input==='start'){if(!t.value)return;state.start=t.value;state.selected=t.value;state.measureWeek=1;save();render();toast('Inicio actualizado');return;}if(t.dataset.input==='measureweek'){state.measureWeek=clamp(Number(t.value),0,12);save();let el=document.getElementById('weightInput'),wa=document.getElementById('waistInput'),m=state.measurements[String(state.measureWeek)]||{};if(el)el.value=m.weight||'';if(wa)wa.value=m.waist||'';return;}});
document.getElementById('backupInput').addEventListener('change',async function(){let f=this.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='ritmo-salud'||!x.data||x.data.version!==1||!x.data.start||typeof x.data.status!=='object'||typeof x.data.measurements!=='object')throw new Error('Archivo incompatible');if(!confirm('Se reemplazarán los registros actuales por los del respaldo. ¿Continuar?'))return;state=cleanLegacy({...def(),...x.data});state.selected=within(state.selected)?state.selected:state.start;state.tab='today';save();render();toast('Respaldo restaurado correctamente');}catch(err){toast('No se pudo importar: formato de respaldo inválido');}finally{this.value='';}});
render();
if((location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
if(location.protocol==='https:'||location.hostname==='localhost'){let l=document.createElement('link');l.rel='manifest';l.href='./manifest.webmanifest';document.head.appendChild(l);let ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href='./icon-192.png';document.head.appendChild(ap);}
})();
